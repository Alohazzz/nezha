name: Release Desktop Builds

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # 给已发布的 tag 补跑构建：发版时若构建失败，Release 会是个没有安装包的空壳
  # （v0.36.0 即此情况）。tag 不可重打，用这里把产物补挂到现有 Release 上。
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（如 v0.36.0）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 手动补跑时按输入的 tag 检出，保证构建的是已发布 tag 的代码。
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check tag matches package.json / Cargo.toml / tauri.conf.json
        run: |
          set -euo pipefail
          # push 触发用 GITHUB_REF_NAME；dispatch 触发读输入。
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG_NAME#v}"
          PKG=$(jq -r .version package.json)
          TAURI=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO=$(awk -F\" '/^version[[:space:]]*=/ {print $2; exit}' src-tauri/Cargo.toml)
          echo "tag=$TAG package.json=$PKG tauri.conf.json=$TAURI Cargo.toml=$CARGO"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$TAURI" ] || [ "$TAG" != "$CARGO" ]; then
            echo "::error::Version mismatch — tag '$TAG' must equal package.json ($PKG), tauri.conf.json ($TAURI), and Cargo.toml ($CARGO)"
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    # codex-app-server-protocol 走 git 依赖拉取整个 openai/codex 仓库，其中包含一条
    # 193 字符的 TUI snapshot 文件名。默认 CARGO_HOME（C:\Users\runneradmin\.cargo）
    # 下拼接后总长 266 字符，超过 Windows MAX_PATH=260，cargo 检出直接报
    # Filesystem(30) path too long，导致整个 release 构建失败（v0.36.0 即此原因）。
    # 缩短 CARGO_HOME 把路径落回 260 以内，并用 git CLI 检出配合 core.longpaths 兜底。
    env:
      CARGO_HOME: C:\c
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      # 只发 Windows（x64 + ARM64）：macOS / Linux 的安装包用不上，构建却在每次
      # 发版里占掉大部分时长与 runner 配额。需要恢复时把对应条目加回 include 即可
      # （下面的 Linux 系统依赖安装步骤按 runner 条件保留，未删）。
      matrix:
        include:
          - name: Windows x86_64
            artifact_name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_args: --bundles nsis,msi
          - name: Windows ARM64
            artifact_name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle_args: --bundles nsis,msi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # git CLI 检出长路径需要该配置；系统级设置失败不致命（CARGO_HOME 已缩短）。
          git config --system core.longpaths true
          Write-Host "core.longpaths=$(& git config --system --get core.longpaths)"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 侧载 ConPTY 资源按架构分目录 vendor(见 src-tauri/resources/conpty/README.md),
      # 而 tauri.windows.conf.json 的 resources glob 无法按构建目标过滤;
      # 打包前删掉非目标架构目录,避免每个安装包多带一套 ~1.2MB 的无用二进制。
      # continue-on-error:此步只是包体优化,失败(如杀软扫描锁文件)就回到
      # "两套都打入"的现状,不值得中断整个 release 构建。
      - name: Prune non-target ConPTY arch (Windows)
        if: contains(matrix.target, 'windows')
        continue-on-error: true
        shell: pwsh
        run: |
          $keep = if ("${{ matrix.target }}".StartsWith("aarch64")) { "arm64" } else { "x64" }
          Get-ChildItem src-tauri/resources/conpty -Directory |
            Where-Object { $_.Name -ne $keep } |
            Remove-Item -Recurse -Force
          Write-Host "保留架构: $keep"

      - name: Build ${{ matrix.name }}
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      # 手动补跑只能给已存在的 Release 追加安装包：gh release upload 不会碰正文，
      # 避免把仓库里手写的发版公告覆盖成自动生成的 release notes。
      - name: Upload assets to existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::没有找到任何构建产物，拒绝更新 Release"
            exit 1
          fi
          printf '即将上传 %d 个文件到 %s\n' "${#files[@]}" "$TAG"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
